<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 390" width="1400" height="390" role="img" aria-labelledby="t d">
<title id="t">置換のときの 3 本の時間軸と波及チェック</title>
<desc id="d">起票・合意・実装完了の 3 時点で、新 GDR・旧 GDR・波及先がそれぞれどう変わるか。① 列挙、② 判定、③ 付け替え、不変条件を満たしてからの退避。</desc>

<style>
  svg { --bg:#faf9f6; --fg:#1f2328; --muted:#5f6670; --line:#d6d3cc; --lane:#f0eee8; --lane2:#e9e6de;
        --card:#ffffff; --accent:#0f7b8a; --accent-soft:rgba(15,123,138,.12); --cut:#9a9a9a; --warn:#be123c;
        --pp:#2563eb; --pd:#15803d; --pc:#b45309; --pa:#be123c; --ontext:#ffffff; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#16181d; --fg:#e6e6e6; --muted:#a0a6ad; --line:#3a3d44; --lane:#1e2127; --lane2:#23262d;
          --card:#1b1e23; --accent:#3cc0cf; --accent-soft:rgba(60,192,207,.14); --cut:#6b6f76; --warn:#fb7185;
          --pp:#60a5fa; --pd:#4ade80; --pc:#fbbf24; --pa:#fb7185; --ontext:#111111; }
  }
  text { font-family: "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",system-ui,sans-serif; fill: var(--fg); }
  .bg { fill: var(--bg); }
  .title { font-size: 17px; font-weight: 700; }
  .h { font-size: 13px; font-weight: 700; }
  .b { font-size: 12px; font-weight: 700; }
  .s { font-size: 11px; fill: var(--muted); }
  .xs { font-size: 10px; fill: var(--muted); }
  .lab { font-size: 13px; font-weight: 700; fill: var(--muted); }
  .on { fill: var(--ontext); font-weight: 700; font-size: 12px; text-anchor: middle; dominant-baseline: central; }
  .card { fill: var(--card); stroke: var(--line); }
  .lane { fill: var(--lane); }
  .lane2 { fill: var(--lane2); }
  .pill { fill: var(--card); stroke: var(--accent); }
  .pilltx { font-size: 10.5px; font-weight: 700; fill: var(--accent); text-anchor: middle; dominant-baseline: central; }
  .ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
  .lnf { stroke: var(--fg); stroke-width: 2; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  .mid { text-anchor: middle; }
  .end { text-anchor: end; }
</style>
<defs>
  <marker id="aM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker>
  <marker id="aF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--fg)"/></marker>
  <marker id="aW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn)"/></marker>
  <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1400" height="390" rx="12"/>
<text class="title" x="30" y="34">置換のときの 3 本の時間軸と波及チェック</text>
<text class="h mid" x="330" y="70">起票（新が Proposed）</text>
<line class="ln dash" x1="330" y1="80" x2="330" y2="292"/>
<text class="h mid" x="700" y="70">合意（新が Accepted）</text>
<line class="ln dash" x1="700" y1="80" x2="700" y2="292"/>
<text class="h mid" x="1070" y="70">実装完了（新が Implemented）</text>
<line class="ln dash" x1="1070" y1="80" x2="1070" y2="292"/>
<rect class="lane" x="150" y="92" width="1220" height="56" rx="6"/>
<rect class="lane2" x="150" y="158" width="1220" height="56" rx="6"/>
<rect class="lane" x="150" y="224" width="1220" height="56" rx="6"/>
<text class="lab end" x="140" y="125">新 GDR</text>
<text class="lab end" x="140" y="191">旧 GDR</text>
<text class="lab end" x="140" y="252">波及先</text>
<text class="xs end" x="140" y="268">旧を depends-on /</text>
<text class="xs end" x="140" y="280">refines する有効な GDR</text>
<line class="lnf" x1="445" y1="120" x2="583" y2="120" marker-end="url(#aF)"/>
<line class="lnf" x1="815" y1="120" x2="953" y2="120" marker-end="url(#aF)"/>
<rect class="pill" x="215" y="106" width="230" height="28" rx="14.0" style="fill:var(--pp);stroke:none"/><text class="on" x="330.0" y="120.0">Proposed</text>
<rect class="pill" x="585" y="106" width="230" height="28" rx="14.0" style="fill:var(--accent);stroke:none"/><text class="on" x="700.0" y="120.0">Accepted (supersedes 旧)</text>
<rect class="pill" x="955" y="106" width="230" height="28" rx="14.0" style="fill:var(--pd);stroke:none"/><text class="on" x="1070.0" y="120.0">Implemented (supersedes 旧)</text>
<rect class="pill" x="215" y="172" width="230" height="28" rx="14.0" style="fill:var(--pd);stroke:none"/><text class="on" x="330.0" y="186.0">有効のまま（実装は旧に従う）</text>
<rect class="pill" x="585" y="172" width="230" height="28" rx="14.0" style="fill:var(--cut);stroke:none"/><text class="on" x="700.0" y="186.0">Superseded by 新（元の位置）</text>
<rect x="955" y="172" width="230" height="28" rx="14" style="fill:var(--card);stroke:var(--cut);stroke-dasharray:4 3"/>
<text class="b mid" x="1070" y="190" style="fill:var(--muted)">退避（不変条件を満たしてから）</text>
<line class="ln" x1="1187" y1="186" x2="1240" y2="186" marker-end="url(#aM)"/>
<text class="s" x="1248" y="190">退避領域</text>
<rect x="215" y="238" width="230" height="28" rx="14" style="fill:var(--card);stroke:var(--pp);stroke-width:2"/>
<text class="b mid" x="330" y="256">① 列挙 → 影響に「波及候補」</text>
<rect x="585" y="238" width="230" height="28" rx="14" style="fill:var(--card);stroke:var(--pa);stroke-width:2"/>
<text class="b mid" x="700" y="256">② 判定（人間が 1 件ずつ）</text>
<rect x="955" y="238" width="230" height="28" rx="14" style="fill:var(--card);stroke:var(--pd);stroke-width:2"/>
<text class="b mid" x="1070" y="256">③ 「関連」を付け替え</text>
<line class="ln" x1="445" y1="252" x2="583" y2="252" marker-end="url(#aM)"/>
<line class="ln" x1="815" y1="252" x2="953" y2="252" marker-end="url(#aM)"/>
<line class="ln" x1="1070" y1="238" x2="1070" y2="204" marker-end="url(#aM)"/>
<path d="M700 268 C700 300 640 310 600 318" style="fill:none;stroke:var(--warn);stroke-width:1.5" marker-end="url(#aW)"/>
<text class="s end" x="590" y="322" style="fill:var(--warn)">影響あり → その GDR を置換する GDR を起票（同じ流れを再帰）</text>
<text class="s" x="712" y="322">影響なし → 処置（付け替える / 外す / relates-to に弱める）と根拠を記録</text>
<text class="s" x="150" y="350">合意後に新が撤回されたら旧は復帰する。「関連」は ③ まで旧を指したままなので戻す作業はない。</text>
<text class="s" x="150" y="368">撤回そのもの（Accepted → Rejected）も同じ ①〜③ を行う（撤回を諮る時点で列挙、確定時に判定、退避の前に付け替え）。</text>
</svg>
